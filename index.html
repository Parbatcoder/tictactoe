<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Parbat Debnath" />
  <meta name="description" content="Simple Javascript based tic tac toe game"/>
  <title>tic-tac-toe</title>
  <link rel="icon" type="image/jpg" href="logo.jpg">
  <link rel="stylesheet" href="style.css" type="text/css" media="all" />
</head>

<body>
  <div class="navbar">
    <p>TIC TAC TOE</p>
  </div>
  <div>
    <div class="scorecontainer">
      <p id="playerScore1">PLAYER 1 : 00</p>
      <p id="playerScore2">PLAYER 2 : 00</p>
    </div>
  </div>
  <div class="mainframe">
    <div class="playarea">
      <div id="1"></div>
      <div id="2"></div>
      <div id="3"></div>
      <div id="4"></div>
      <div id="5"></div>
      <div id="6"></div>
      <div id="7"></div>
      <div id="8"></div>
      <div id="9"></div>
    </div>
    <div id="line1"></div>
    <div id="line2"></div>
    <div id="line3"></div>
    <div id="line4"></div>
    <div id="line5"></div>
    <div id="line6"></div>
    <div id="line7"></div>
    <div id="line8"></div>
  </div>
  <script src="script.js" type="text/javascript" charset="utf-8"></script>
</body>

</html>
